# Production stack: PostgreSQL + one-shot migration + app.
# Copy .env.production.example to .env, fill it in, then: docker compose -f compose.prod.yaml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vonmuslim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vonmuslim
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vonmuslim -d vonmuslim"]
      interval: 2s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://vonmuslim:${POSTGRES_PASSWORD}@postgres:5432/vonmuslim
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vonmuslim:${POSTGRES_PASSWORD}@postgres:5432/vonmuslim
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
